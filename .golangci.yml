linters:
  disable:
    - staticcheck
  enable:
    - govet
    - errcheck
    - unused
    - ineffassign
    - gosimple

# Per-linter configuration. The block below turns on individual `go vet`
# analyzers inside the "govet" linter (this must be nested under
# `linters-settings.govet`, NOT at the top level of `linters-settings` —
# putting `enable`/`disable` directly under `linters-settings` is invalid
# against golangci-lint's config schema and fails `golangci-lint config
# verify` in CI).
linters-settings:
  govet:
    enable:
      - asmdecl
      - assign
      - atomic
      - atomicalign
      - bools
      - buildtag
      - cgocall
      - composites
      - copylocks
      - deepequalerrors
      - errorsas
      - fieldalignment
      - findcall
      - framepointer
      - httpresponse
      - ifaceassert
      - loopclosure
      - lostcancel
      - nilfunc
      - nilness
      - printf
      - reflectvaluecompare
      - shadow
      - shift
      - sigchanyzer
      - sortslice
      - stdmethods
      - stringintconv
      - structtag
      - testinggoroutine
      - tests
      - unmarshal
      - unreachable
      - unsafeptr
      - unusedresult
      - unusedwrite

issues:
  exclude-rules:
    # All tests
    - path: _test\.go
      linters:
        - cyclop
        - exhaustivestruct
        - funlen
        - goerr113
        - lll
        - wrapcheck
    # Table-driven test structs are ordered for readability, not for memory
    # layout — don't ask table-driven tests to reorder fields for alignment.
    - path: _test\.go
      linters:
        - govet
      text: "fieldalignment"
    # Mockery-generated code — never hand-edit, never lint.
    - path: mocks/.*\.go
      linters:
        - all
